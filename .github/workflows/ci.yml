name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run JUnit Tests
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy code từ repo về
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Build + chạy toàn bộ JUnit test
      - name: Build and run tests
        run: mvn test --no-transfer-progress

      # Bước 4: Lưu kết quả test để xem lại trên GitHub
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
